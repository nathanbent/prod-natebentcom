# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://natebent.com"
title: NateBent.com
theme: [hugo-PaperMod]

# --- NEW: pagination (replaces deprecated top-level 'paginate') -------------
pagination:
  pagerSize: 10
# ---------------------------------------------------------------------------

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "about-me/"]
# googleAnalytics: UA-123-45

minify:
  disableXML: true
  minifyOutput: true          # NEW: minify HTML output

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: /pages/about-me
          weight: 5
        - name: Posts
          url: /posts
          weight: 10
        # --- NEW: search menu entry (needs content/search.md, see notes) ---
        - name: Search
          url: /search/
          weight: 15
        # -------------------------------------------------------------------
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Nate Bent's website and portfolio"
  author: Nathan Bent
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  ShowWordCount: true           # NEW: word count next to reading time
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]
  social: true

  # --- NEW: "Suggest changes" link on each post (edit YOURUSER/repo) --------
  editPost:
    URL: "https://github.com/YOURUSER/prod-natebentcom/tree/main/content"
    Text: "Suggest changes"
    appendFilePath: true
  # -------------------------------------------------------------------------

 # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: NateBent.com
    subtitle: " 👋 Welcome to my website!  This is a collection of my experience, projects and thoughts"
    imageUrl: "/pages/about-me/images/profile-pic.png"
    imageWidth: 120
    imageHeight: 120
    imageTitle: Profile-Picture
    buttons:
      - name: About Me
        url: /pages/about-me/
      - name: Posts
        url: /posts/

  assets:
    disableHLJS: true
    favicon: "/favicon-light.png"              # NEW
    favicon16x16: "/favicon-light.png"         # NEW
    favicon32x32: "/favicon-light.png"         # NEW
    apple_touch_icon: "/favicon-light.png"     # NEW
    safari_pinned_tab: "/favicon-light.png"    # NEW

  markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
