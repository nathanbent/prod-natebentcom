<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="392" rx="14" fill="url(#cardbg)" stroke="#2a3a55" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="44" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="600">Anatomy of one address out of my /56</text>
  <text x="400" y="68" text-anchor="middle" fill="#8b98ad" font-size="13">VLAN 20's gateway on the Brocade: 2001:db8:1234:b214::1/64</text>

  <!-- the address, colored by field -->
  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="26" font-weight="600">
    <text x="96" y="128" fill="#4fc3f7" textLength="265">2001:0db8:1234:b2</text>
    <text x="361" y="128" fill="#ffb74d" textLength="31">14</text>
    <text x="392" y="128" fill="#e2e8f0" textLength="16">:</text>
    <text x="408" y="128" fill="#81c784" textLength="296">0000:0000:0000:0001</text>
  </g>

  <!-- braces / field bars -->
  <g>
    <!-- ISP prefix bar -->
    <rect x="96" y="144" width="265" height="10" rx="5" fill="#4fc3f7" opacity="0.9"/>
    <!-- subnet id bar -->
    <rect x="361" y="144" width="31" height="10" rx="5" fill="#ffb74d" opacity="0.9"/>
    <!-- interface id bar -->
    <rect x="408" y="144" width="296" height="10" rx="5" fill="#81c784" opacity="0.9"/>
  </g>

  <!-- bit scale -->
  <g font-size="12" fill="#64748b" font-family="ui-monospace, Menlo, Consolas, monospace">
    <text x="96" y="174">bit 0</text>
    <text x="361" y="174" text-anchor="end">55</text>
    <text x="392" y="174" text-anchor="end">63</text>
    <text x="704" y="174" text-anchor="end">127</text>
  </g>

  <!-- field labels -->
  <g font-size="15">
    <text x="210" y="212" text-anchor="middle" fill="#4fc3f7" font-weight="600">Cox's /56</text>
    <text x="210" y="232" text-anchor="middle" fill="#8b98ad" font-size="12.5">delegated via DHCPv6-PD.</text>
    <text x="210" y="248" text-anchor="middle" fill="#8b98ad" font-size="12.5">Theirs to change, and they do.</text>

    <text x="377" y="212" text-anchor="middle" fill="#ffb74d" font-weight="600">Subnet ID</text>
    <text x="377" y="232" text-anchor="middle" fill="#8b98ad" font-size="12.5">8 bits = my 256</text>
    <text x="377" y="248" text-anchor="middle" fill="#8b98ad" font-size="12.5">/64s to carve up</text>

    <text x="585" y="212" text-anchor="middle" fill="#81c784" font-weight="600">Interface ID</text>
    <text x="585" y="232" text-anchor="middle" fill="#8b98ad" font-size="12.5">64 bits = SLAAC's playground,</text>
    <text x="585" y="248" text-anchor="middle" fill="#8b98ad" font-size="12.5">or ::1 for a router by hand</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="280" x2="740" y2="280" stroke="#2a3a55" stroke-width="1"/>

  <!-- the convention row -->
  <g font-size="14">
    <text x="400" y="310" text-anchor="middle" fill="#c8d2e0">The subnet ID tracks the IPv4 VLAN ID, so an address reads like a label:</text>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5">
    <text x="150" y="345" fill="#8b98ad">VLAN 2</text>
    <text x="150" y="365" fill="#ffb74d">...b2</text>
    <text x="187" y="365" fill="#ffb74d" font-weight="700">02</text>
    <text x="345" y="345" fill="#8b98ad">VLAN 20 (0x14)</text>
    <text x="345" y="365" fill="#ffb74d">...b2</text>
    <text x="382" y="365" fill="#ffb74d" font-weight="700">14</text>
    <text x="565" y="345" fill="#8b98ad">Transit to the Brocade</text>
    <text x="565" y="365" fill="#ffb74d">...b2</text>
    <text x="602" y="365" fill="#ffb74d" font-weight="700">00</text>
  </g>
</svg>
