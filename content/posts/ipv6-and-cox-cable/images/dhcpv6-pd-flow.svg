<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cardbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141c2b"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b98ad"/>
    </marker>
    <marker id="arrowcyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="4" y="4" width="792" height="512" rx="14" fill="url(#cardbg2)" stroke="#2a3a55" stroke-width="1.5"/>

  <!-- title -->
  <text x="400" y="42" text-anchor="middle" fill="#e2e8f0" font-size="21" font-weight="600">Where the /56 goes, and where the automation stops</text>

  <!-- Cox -->
  <rect x="60" y="70" width="220" height="64" rx="10" fill="#1b2942" stroke="#3b82a0" stroke-width="1.5"/>
  <text x="170" y="97" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Cox</text>
  <text x="170" y="118" text-anchor="middle" fill="#8b98ad" font-size="12.5">DHCPv6-PD server (DOCSIS)</text>

  <!-- PD exchange arrows -->
  <line x1="200" y1="134" x2="200" y2="196" stroke="#8b98ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="196" x2="140" y2="134" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrowcyan)"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="215" y="158" fill="#4fc3f7">Solicit, prefix-hint ::/56</text>
    <text x="215" y="176" fill="#8b98ad">IA_PD: 2001:db8:1234:b200::/56</text>
  </g>

  <!-- FortiGate -->
  <rect x="60" y="200" width="220" height="76" rx="10" fill="#1b2942" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="170" y="228" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">FortiGate</text>
  <text x="170" y="248" text-anchor="middle" fill="#8b98ad" font-size="12.5">PD client on WAN-LACP</text>
  <text x="170" y="265" text-anchor="middle" fill="#8b98ad" font-size="12.5">ip6-mode delegated on LAN-LACP</text>

  <!-- carving: strip of /64s -->
  <text x="540" y="222" text-anchor="middle" fill="#c8d2e0" font-size="13.5">One /56 = 256 individual /64s</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="330" y="232" width="78" height="44" rx="6" fill="#173042" stroke="#4fc3f7" stroke-width="1.3"/>
    <text x="369" y="251" fill="#4fc3f7">b200</text>
    <text x="369" y="267" fill="#8b98ad" font-size="10.5">transit</text>

    <rect x="416" y="232" width="78" height="44" rx="6" fill="#2b2416" stroke="#ffb74d" stroke-width="1.3"/>
    <text x="455" y="251" fill="#ffb74d">b202</text>
    <text x="455" y="267" fill="#8b98ad" font-size="10.5">VLAN 2</text>

    <rect x="502" y="232" width="78" height="44" rx="6" fill="#2b2416" stroke="#ffb74d" stroke-width="1.3"/>
    <text x="541" y="251" fill="#ffb74d">b214</text>
    <text x="541" y="267" fill="#8b98ad" font-size="10.5">VLAN 20</text>

    <rect x="588" y="232" width="60" height="44" rx="6" fill="#1a2333" stroke="#3a4a63" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="618" y="256" fill="#64748b">...</text>

    <rect x="656" y="232" width="78" height="44" rx="6" fill="#1a2333" stroke="#3a4a63" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="695" y="251" fill="#64748b">b2ff</text>
    <text x="695" y="267" fill="#8b98ad" font-size="10.5">spare</text>
  </g>
  <line x1="280" y1="240" x2="326" y2="248" stroke="#8b98ad" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- transit link down to Brocade -->
  <line x1="170" y1="276" x2="170" y2="352" stroke="#8b98ad" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g font-size="12" fill="#8b98ad">
    <text x="185" y="304">b200::1 (FGT)  /  b200::2 (ICX)</text>
    <text x="185" y="322">OSPFv3: default route flows down</text>
  </g>

  <!-- Brocade -->
  <rect x="60" y="356" width="220" height="76" rx="10" fill="#1b2942" stroke="#e57373" stroke-width="1.5"/>
  <text x="170" y="384" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Brocade ICX 6610</text>
  <text x="170" y="404" text-anchor="middle" fill="#8b98ad" font-size="12.5">OSPFv3: yes</text>
  <text x="170" y="421" text-anchor="middle" fill="#e57373" font-size="12.5">DHCPv6-PD client: no</text>

  <!-- manual boundary annotation -->
  <line x1="330" y1="300" x2="750" y2="300" stroke="#e57373" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="540" y="292" text-anchor="middle" fill="#e57373" font-size="12.5" font-weight="600">automation ends here</text>

  <!-- ve interfaces block -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">
    <rect x="330" y="330" width="420" height="128" rx="8" fill="#1a1420" stroke="#e57373" stroke-width="1.2"/>
    <text x="350" y="356" fill="#8b98ad">! typed in by hand, re-typed on every new /56</text>
    <text x="350" y="380" fill="#c8d2e0">interface ve 2</text>
    <text x="350" y="398" fill="#c8d2e0"> ipv6 address 2001:db8:1234:b2</text>
    <text x="577" y="398" fill="#ffb74d" font-weight="700">02</text>
    <text x="594" y="398" fill="#c8d2e0">::1/64</text>
    <text x="350" y="422" fill="#c8d2e0">interface ve 20</text>
    <text x="350" y="440" fill="#c8d2e0"> ipv6 address 2001:db8:1234:b2</text>
    <text x="577" y="440" fill="#ffb74d" font-weight="700">14</text>
    <text x="594" y="440" fill="#c8d2e0">::1/64</text>
  </g>

  <!-- footer -->
  <text x="400" y="492" text-anchor="middle" fill="#64748b" font-size="12">New FortiGate = new DUID = new /56 from Cox = every address in the red box goes stale.</text>
</svg>
