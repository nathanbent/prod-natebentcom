<svg width="680" height="380" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One Terraform map driving FortiGate and Proxmox</title>
<desc>A single terraform map at the top splits into two cards, FortiGate and Proxmox cluster, joined underneath by a dashed VXLAN overlay tunnel carrying three segment markers.</desc>
<style>
@import url('https://fonts.googleapis.com/css2?family=Karla:wght@400;500&amp;family=Rubik:wght@400;500&amp;display=swap');
.h{font-family:'Rubik','Segoe UI',Helvetica,Arial,sans-serif;}
.b{font-family:'Karla','Segoe UI',Helvetica,Arial,sans-serif;}
.mapbox{fill:#E9EFF3;stroke:#1B5A7A;}
.map-title{fill:#1B5A7A;}
.map-sub{fill:#5A6B79;}
.fgt-shape{fill:#1B5A7A;stroke:#1B5A7A;}
.fgt-text{fill:#E9EFF3;}
.fgt-sub{fill:#B5D4F4;}
.pve-shape{fill:#FFFFFF;stroke:#1C2733;}
.pve-text{fill:#1C2733;}
.pve-sub{fill:#5A6B79;}
.tunnel{stroke:#1B5A7A;}
.seg{fill:#E9EFF3;stroke:#1B5A7A;}
.arrline{stroke:#5A6B79;}
@media (prefers-color-scheme: dark){
.mapbox{fill:#242D38;stroke:#7FB3D6;}
.map-title{fill:#7FB3D6;}
.map-sub{fill:#92A0AD;}
.fgt-shape{fill:#7FB3D6;stroke:#7FB3D6;}
.fgt-text{fill:#12161B;}
.fgt-sub{fill:#0C447C;}
.pve-shape{fill:#242D38;stroke:#D8DFE6;}
.pve-text{fill:#D8DFE6;}
.pve-sub{fill:#92A0AD;}
.tunnel{stroke:#7FB3D6;}
.seg{fill:#12161B;stroke:#7FB3D6;}
.arrline{stroke:#92A0AD;}
}
</style>
<defs>
<marker id="hero-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="mapbox" x="245" y="36" width="190" height="72" rx="12" stroke-width="1"/>
<text class="h map-title" x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500">single map</text>
<text class="b map-sub" x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="12">one source of truth</text>
<line class="arrline" x1="300" y1="108" x2="185" y2="172" stroke-width="1" marker-end="url(#hero-arrow)"/>
<line class="arrline" x1="380" y1="108" x2="495" y2="172" stroke-width="1" marker-end="url(#hero-arrow)"/>
<rect class="fgt-shape" x="85" y="178" width="170" height="94" rx="14" stroke-width="1"/>
<text class="h fgt-text" x="170" y="212" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500">FortiGate</text>
<text class="b fgt-sub" x="170" y="236" text-anchor="middle" dominant-baseline="central" font-size="12">anycast gateway</text>
<rect class="pve-shape" x="425" y="178" width="170" height="94" rx="14" stroke-width="1"/>
<text class="h pve-text" x="510" y="212" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="500">Proxmox cluster</text>
<text class="b pve-sub" x="510" y="236" text-anchor="middle" dominant-baseline="central" font-size="12">VNets + VMs</text>
<path class="tunnel" d="M170 272 Q340 344 510 272" fill="none" stroke-width="1.5" stroke-dasharray="5 5" marker-start="url(#hero-arrow)" marker-end="url(#hero-arrow)"/>
<rect class="seg" x="248" y="291" width="52" height="20" rx="10" stroke-width="0.75"/>
<text class="b map-title" x="274" y="301" text-anchor="middle" dominant-baseline="central" font-size="11">4241</text>
<rect class="seg" x="314" y="298" width="52" height="20" rx="10" stroke-width="0.75"/>
<text class="b map-title" x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="11">4242</text>
<rect class="seg" x="380" y="291" width="52" height="20" rx="10" stroke-width="0.75"/>
<text class="b map-title" x="406" y="301" text-anchor="middle" dominant-baseline="central" font-size="11">4130</text>
<text class="b map-sub" x="340" y="350" text-anchor="middle" font-size="12">VXLAN / EVPN overlay</text>
</svg>
