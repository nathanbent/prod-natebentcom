{{- if .IsPage }}
<div id="reading-progress" aria-hidden="true"><span></span></div>

<script>
(function () {
  // Reading progress bar
  var bar = document.querySelector('#reading-progress span');
  if (bar) {
    var update = function () {
      var el = document.documentElement;
      var max = el.scrollHeight - el.clientHeight;
      bar.style.width = (max > 0 ? (el.scrollTop / max) * 100 : 0) + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  }

  // Scroll-tracking TOC highlight
  var toc = document.getElementById('TableOfContents');
  if (toc) {
    var links = {};
    toc.querySelectorAll('a[href^="#"]').forEach(function (a) {
      try { links[decodeURIComponent(a.getAttribute('href').slice(1))] = a; } catch (e) {}
    });
    var headings = document.querySelectorAll(
      '.post-content h1[id], .post-content h2[id], .post-content h3[id], .post-content h4[id]'
    );
    if (headings.length) {
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting && links[entry.target.id]) {
            toc.querySelectorAll('a.active').forEach(function (a) { a.classList.remove('active'); });
            links[entry.target.id].classList.add('active');
          }
        });
      }, { rootMargin: '0px 0px -80% 0px', threshold: 0 });
      headings.forEach(function (h) { obs.observe(h); });
    }
  }
})();
</script>
<script>
(function () {
  var content = document.querySelector('.post-content');
  if (!content) return;

  var overlay = null;
  var onKey = function (e) { if (e.key === 'Escape') close(); };

  function close() {
    if (!overlay) return;
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
    var o = overlay; overlay = null;
    setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, 200);
  }

  content.addEventListener('click', function (e) {
    var img = e.target.closest('img');
    if (!img) return;
    if (img.classList.contains('in-text')) return;  // skip inline icons
    if (img.closest('a')) return;                    // let linked images follow their link

    overlay = document.createElement('div');
    overlay.className = 'lightbox';

    var box = document.createElement('figure');
    box.className = 'lightbox-inner';

    var big = document.createElement('img');
    big.src = img.getAttribute('data-full') || img.currentSrc || img.src;
    big.alt = img.alt || '';
    box.appendChild(big);

    var cap = img.closest('figure') &&
              img.closest('figure').querySelector('figcaption');
    if (cap && cap.textContent.trim()) {
      var c = document.createElement('figcaption');
      c.textContent = cap.textContent.trim();
      box.appendChild(c);
    }

    var full = img.getAttribute('data-full');
    if (full) {
      var dl = document.createElement('a');
      dl.href = full;
      dl.download = '';
      dl.textContent = 'Download full image';
      dl.className = 'lightbox-download';
      dl.addEventListener('click', function (e) { e.stopPropagation(); });
      box.appendChild(dl);
    }

    overlay.appendChild(box);
    overlay.addEventListener('click', close);
    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';         // lock background scroll
    requestAnimationFrame(function () { overlay.classList.add('open'); });
    document.addEventListener('keydown', onKey);
  });
})();
</script>
{{- end }}
