- text: "We've arranged a global civilization in which most crucial elements profoundly depend on science and technology. We have also arranged things so that almost no one understands science and technology. This is a prescription for disaster. We might get away with it for a while, but sooner or later this combustible mixture of ignorance and power is going to blow up in our faces."
  source: "Carl Sagan"
- text: "Technological progress has merely provided us with more efficient means for going backwards."
  source: "Aldous Huxley"
- text: "Before you become too entranced with gorgeous gadgets and mesmerizing video displays, let me remind you that information is not knowledge, knowledge is not wisdom, and wisdom is not foresight. Each grows out of the other, and we need them all."
  source: "Arthur C. Clarke"
- text: "First we thought the PC was a calculator. Then we found out how to turn numbers into letters with ASCII — and we thought it was a typewriter. Then we discovered graphics, and we thought it was a television. With the World Wide Web, we've realized it's a brochure."
  source: "Douglas Adams"
- text: "We are stuck with technology when what we really want is just stuff that works."
  source: "Douglas Adams"
- text: "The sun shines not on us but in us. The rivers flow not past, but through us. Thrilling, tingling, vibrating every fiber and cell of the substance of our bodies, making them glide and sing."
  source: "John Muir"
- text: "Do not be too moral. You may cheat yourself out of much life so. Aim above morality. Be not simply good, be good for something."
  source: "Henry David Thoreau"
